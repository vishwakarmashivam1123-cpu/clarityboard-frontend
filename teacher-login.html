<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="loading">
    <div class="app-loader" id="appLoader">
      <span class="app-loader-logo">ClarityBoard</span>
      <span class="app-loader-tagline">Feedback without fear, made simple</span>
      <div class="app-loader-spinner"></div>
    </div>

    <header class="site-header">
      <span class="site-header-logo">ClarityBoard</span>
      <span class="site-header-tagline">Anonymous feedback, made simple</span>
    </header>

    <div class="page-wrap">
      <div class="container">
          <h1 style="text-align: center;">Teacher Login</h1>
          <input type="text" id="username" placeholder="Username" required>
          <input type="password" id="password" placeholder="Password" required>
          <button id="login-button">Login</button>
          <p id="LoginError" class="error" style="color: red;"></p>
          <p class="switch-link">New teacher? <a href="teacher-register.html">Register here</a></p>
      </div>
    </div>

    <footer class="site-footer">
      <p>Made By Shivam for better classrooms — ClarityBoard © 2026</p>
    </footer>

    <script src="Script.js"></script>
</body>
</html>
