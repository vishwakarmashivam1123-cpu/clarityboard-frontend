<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-ClarityBoard </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Student Login Content -->
     <div class="container">
        <div id="codestage">
            <h1>Enter Subject Code</h1>
            <input type="text" id="SubjectCode" placeholder="e.g. 482913" maxlength="6">
            <button id="joinButton">Join Class</button>
            <p id="code-error" class="error" style="color: red;"></p>
        </div>
        <!--Feedback Section-->
        <div id="feedbackStage" class="hidden">
            <h1>Today's Topic</h1>
            <div id="topiclist"></div>
            
            <h2>Overall Doubts</h2>
            <textarea id="overall-doubts" placeholder="Enter your doubts here..." ></textarea>
            
            <h2>Rate Lecture(1-5)</h2>
            <div id="starRating"></div>
            
            <h2>Suggestions</h2>
            <textarea id="suggestions" placeholder="Enter your suggestions here..." ></textarea>

            <p id="submit-error" class="error"></p>
            <button id="submitfeedback">Submit Feedback</button>
        </div>

        <!--Thank You Message (hidden at first)-->
        <div id="thankYouStage" class="hidden">
            <h1>Thank You for Your Feedback!</h1>
            <p>We appreciate your input and will use it to improve future lectures.</p>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
